<style>:root {

*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;background:var(--canvas);color:var(--ink)}

.title{margin:2px 0 0;font-size:var(--f-title);line-height:1.5;font-weight:750;overflow-wrap:anywhere}.count{text-align:center;font-size:.75rem;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}

.icon-button:hover{background:var(--surface-warm)}.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.visual-stage{position:relative;background:var(--surface-green);display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
.artboard{position:relative;width:100%;height:100%;flex:none;max-width:100%;isolation:isolate}
.blank-image{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.diagram-layer{position:absolute;inset:0;pointer-events:none}

.diagram-symbol::before{content:"";width:53%;height:53%;border:1px solid #ACC9B9;border-radius:50%;background:#C7DBD1}

.symbol-dot{position:absolute;width:13px;height:13px;border:1px solid var(--accent);background:var(--page-bg);border-radius:50%;transform:translate(-50%,-50%)}
.symbol-dot.active{background:var(--accent)}

.detail-map{position:absolute;left:8px;bottom:8px;width:45px;height:34px;border:1px solid #8AAE9C;background:rgb(251 248 240 / .92);border-radius:5px}
.detail-map::after{content:"";position:absolute;inset:8px 14px;border:1px solid var(--accent);border-radius:50%}
.visual-module.is-detail .diagram-layer{transform:scale(1.35);transform-origin:50% 48%}.visual-module.is-detail .object-label.a{left:16.25%;top:14.25%}.visual-module.is-detail .object-label.b{left:83.75%;top:81.75%}
.visual-caption{margin:0;border-top:1px solid rgb(203 209 204 / .65);background:var(--surface);padding:12px 16px 14px;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--f-caption);line-height:1.625;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.visual-caption.is-long{text-align:left;align-items:flex-start}.caption-text{width:100%}
.caption-sizer{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;margin:0;border:0;box-sizing:border-box;height:auto!important;min-height:0!important}
.frame-nav{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;margin-top:-12px;font-size:.75rem;line-height:1.5;color:var(--muted)}.frame-nav .icon-button{width:44px;height:44px}.frame-count{min-width:48px;text-align:center}
.question-card{width:min(100%,350px);padding:22px 18px;border:1px solid rgb(203 209 204 / .75);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
.q-context{margin:0 0 10px;font-size:.875rem;line-height:1.6;font-weight:500;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.q-stem{margin:0;font-size:var(--f-hero);line-height:1.5;font-weight:750;text-align:center;overflow-wrap:anywhere}.q-stem.is-long{text-align:left}
.options{display:grid;gap:10px;margin-top:20px}.option{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:12px;border:1px solid var(--line);border-radius:var(--r-option);background:var(--surface);font-size:1rem;line-height:1.56;text-align:left;font-weight:550;overflow-wrap:anywhere}
.option .option-copy{flex:1;min-width:0}.chip{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--surface-green);font-size:.8125rem;font-weight:700;color:var(--accent)}
.option:hover{background:#F5F8F5}.option.correct{border-color:var(--success);background:var(--success-soft);opacity:1}.option.correct .chip{background:var(--success);color:#fff}.option.wrong{border-color:var(--danger);background:var(--danger-soft)}.option.wrong .chip{background:var(--danger);color:#fff}
.answer-note{margin:12px 0 0;min-height:22px;color:var(--success);font-size:.8125rem;line-height:1.6;text-align:center}
.image-question .visual-module{box-shadow:none}.image-question .q-context{display:none}.image-question .question-card{border:0;background:transparent;padding:0;box-shadow:none}.image-question .q-stem{font-size:1.25rem;line-height:1.5}
.text-card{width:min(100%,326px);text-align:center}.text-card h2{margin:0 0 22px;font-size:var(--f-hero);line-height:1.5;overflow-wrap:anywhere}.text-body{margin:0;font-size:var(--f-body);line-height:1.85;font-weight:550;white-space:pre-line;overflow-wrap:anywhere}.text-body.is-long{text-align:left}
.footer{flex:none;display:grid;grid-template-columns:44px 44px minmax(0,1fr) 44px;gap:2px;align-items:center;min-height:66px;padding:8px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgb(203 209 204 / .4);background:var(--page-bg)}
.next-button{min-height:44px;padding:8px 4px;background:transparent;border:0;color:var(--accent);font-size:.8125rem;font-weight:600;line-height:1.5;border-radius:12px}.next-button:hover{background:var(--surface-warm)}
.failure-panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface-green);color:var(--muted);text-align:center;font-size:.875rem;padding:12px}.failure-panel p{margin:0;line-height:1.6}.failure-panel button{border:1px solid var(--line);background:var(--surface);padding:8px 12px;min-height:44px;border-radius:12px;color:var(--accent)}
dialog{position:fixed;inset:0;margin:auto;border:1px solid rgb(203 209 204 / .6);border-radius:var(--r-dialog);padding:0;width:min(350px,calc(100vw - 32px));max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);max-height:min(84dvh,calc(100dvh - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgb(20 40 30 / .18);overflow:hidden}
dialog::backdrop{background:rgb(32 51 45 / .38)}.dialog-layout{display:flex;flex-direction:column;max-height:inherit;min-height:0}.dialog-head{padding:22px 22px 10px;flex:none}.dialog-head h2{margin:0;font-size:1.375rem;line-height:1.5;font-weight:750}.dialog-head p{margin:6px 0 0;font-size:.8125rem;line-height:1.6;color:var(--muted)}
.dialog-body{padding:0 22px 14px;overflow:auto;overscroll-behavior:contain;min-height:0;flex:1}.error-reason{white-space:pre-line;font-size:1rem;line-height:1.75;margin:6px 0 0;overflow-wrap:anywhere}.dialog-actions{flex:none;padding:12px 22px 20px;display:grid;gap:10px;border-top:1px solid rgb(203 209 204 / .5)}
.btn{width:100%;min-height:48px;padding:11px 14px;border:0;border-radius:14px;font-size:1rem;line-height:1.5;font-weight:650;text-align:center}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--surface-green);color:var(--accent)}#errorTitle{color:var(--danger)}
.control-label{display:block;margin:16px 0 6px;font-size:.875rem;line-height:1.6;font-weight:650}.control-label:first-child{margin-top:8px}.control-select{display:block;width:100%;min-height:44px;padding:8px 10px;background:var(--page-bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:.875rem;line-height:1.6}
.check-row{display:flex;align-items:flex-start;gap:10px;margin:16px 0 0;font-size:.875rem;line-height:1.6}.check-row input{width:18px;height:18px;flex:none;accent-color:var(--accent);margin-top:2px}.menu-note{font-size:.75rem;line-height:1.7;color:var(--muted);margin:14px 0 0}
@media(min-width:620px){.app-shell{width:390px;height:min(900px,calc(100dvh - 28px));border:1px solid rgb(203 209 204 / .7);border-radius:30px;box-shadow:0 20px 58px rgb(19 34 29 / .12)}}
@media(max-height:650px){.app-header{min-height:68px;padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px}.screen{padding-top:18px;padding-bottom:20px}.scene-stack{gap:14px}.footer{min-height:60px;padding-top:4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}}

/* Focus handoff preview: the readable lead yields to the full-size image. */
.prelude{font-size:1rem;line-height:1.6;font-weight:550;color:var(--muted)}
.hero-copy{font-size:2rem;line-height:1.55}

/* Reading is a scrollable layout, not an overlay over the hidden image. */
.screen.reading .scene-stack{display:none}
.screen.reading .intro-layer{position:relative;inset:auto;flex:1;min-height:100%;margin-block:auto;display:flex;align-items:center;justify-content:center;padding:28px 0}
.screen.reading .hero-copy{font-size:1.75rem;line-height:1.65}
.screen[data-kind="guide"] .hero-copy{font-size:1.75rem}

/* Course content adapter; frozen layout and interactions stay in components.css/app.js. */
.diagram-layer,.object-label,.placeholder-name,.detail-control{display:none!important}
.text-card h2:empty{display:none}
.image-annotations,.label-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.label-lines{overflow:visible;stroke:var(--accent);stroke-width:.36;fill:var(--accent)}
.image-label{position:absolute;z-index:1;transform:translate(-50%,-50%);max-width:55%;padding:2px 5px;border:1px solid rgb(39 91 75 / .45);border-radius:6px;background:rgb(255 255 255 / .94);color:var(--ink);font-size:clamp(11px,.72rem,14px);line-height:1.35;font-weight:700;text-align:center;white-space:nowrap;box-shadow:0 1px 3px rgb(31 49 43 / .12)}
.screen[data-id="FINAL"] .text-body { white-space: pre-line; }

 },{passive:true});
 course.addEventListener('touchmove',e=>{
  if(!touch||e.touches.length!==1){touch=null;return;}const p=e.touches[0];if(Math.hypot(p.clientX-touch.x,p.clientY-touch.y)>12)touch.moved=true;
 },{passive:true});
 course.addEventListener('touchcancel',()=>{touch=null;blockClickUntil=performance.now()+500;},{passive:true});
 course.addEventListener('touchend',e=>{
  if(!touch)return;const start=touch;touch=null;const p=e.changedTouches[0];if(!p)return;
  const dy=start.y-p.clientY,dx=p.clientX-start.x;if(start.moved||Math.abs(dy)>12)blockClickUntil=performance.now()+500;
  if(activeDialog||!start.ready||start.index!==current||Math.abs(dy)<58||Math.abs(dy)<Math.abs(dx)*1.25||performance.now()<navGuardUntil)return;
  if(dy>0&&start.bottom){forward();navGuardUntil=performance.now()+380;}else if(dy<0&&start.top){backward();navGuardUntil=performance.now()+380;}
 },{passive:true});
 course.addEventListener('click',e=>{if(performance.now()<blockClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
 let wheelLast=0,wheelSum=0,wheelUsed=false,wheelBoundary=false;
 course.addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(now-wheelLast>900){wheelSum=0;wheelUsed=false;wheelBoundary=course.scrollTop+course.clientHeight>=course.scrollHeight-3;}wheelLast=now;if(activeDialog)return;const delta=e.deltaY*(e.deltaMode===1?20:e.deltaMode===2?course.clientHeight:1);if(delta>0&&wheelBoundary){if(!wheelUsed){wheelSum+=delta;if(wheelSum>55){wheelUsed=true;forward();}}}else{course.scrollTop+=delta;}},{passive:false});
 course.addEventListener('scroll',()=>{const v=cache.get(current);if(v)v.autoElapsed=0;},{passive:true});
 window.addEventListener('keydown',e=>{
  if(activeDialog||e.altKey||e.metaKey||e.ctrlKey||e.shiftKey)return;
  if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;
  const top=course.scrollTop<=2,bottom=course.scrollTop+course.clientHeight>=course.scrollHeight-3;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();if(bottom)forward();else course.scrollBy({top:course.clientHeight*.8});}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();if(top)backward();else course.scrollBy({top:-course.clientHeight*.8});}
  else if(e.key==='ArrowDown'&&bottom){e.preventDefault();forward();}else if(e.key==='ArrowUp'&&top){e.preventDefault();backward();}
 });
 document.addEventListener('visibilitychange',()=>{docHidden=document.hidden;lastTick=performance.now();trace('visibility',{hidden:docHidden});});
 media.addEventListener('change',()=>{trace('motion-preference',{reduced:isReduced()});});
 window.addEventListener('resize',queueLayout);window.visualViewport?.addEventListener('resize',queueLayout);
 new ResizeObserver(queueLayout).observe(course);
 function loop(now){
  const dt=Math.min(80,Math.max(0,now-lastTick));lastTick=now;
  const v=cache.get(current);
  if(v&&!paused()&&fontReady){
   if(v.answerElapsed!==null){v.answerElapsed+=dt;if(v.answerElapsed>=TEMPLATE_TIMING.answerConfirm){v.answerElapsed=null;if(current<deck.length-1)showPage(current+1);else{v.note.textContent='回答正确';updateControls();}}}
   else if(v.entrance){
    v.entrance.elapsed=Math.min(v.entrance.duration,v.entrance.elapsed+dt);
    const p=v.entrance.elapsed/v.entrance.duration,e=(1-Math.cos(Math.PI*p))/2;
    v.hero.style.opacity=String(e);
    v.hero.style.transform=`translateY(${12*(1-e)}px)`;
    if(p>=1){v.hero.style.opacity='';v.hero.style.transform='';v.entrance=null;v.phase='await-image';updateControls();}
   }
   else if(v.runner&&!v.runner.done){v.runner.tick(dt);}
   else if(false&&v.done&&prefs.mode==='auto'&&!v.data.kind.includes('uestion')&&(current<deck.length-1||(v.data.kind==='teach'&&v.frame<v.data.frames-1))){
    const bottom=course.scrollTop+course.clientHeight>=course.scrollHeight-3;
    if(bottom){v.autoElapsed+=dt;const len=(v.data.body||v.data.captions?.[v.frame]||'').length;
     if(v.autoElapsed>=Math.max(TEMPLATE_TIMING.autoReadMin,len*220+1000)){if(v.data.kind==='teach'&&v.frame<v.data.frames-1)selectFrame(v,v.frame+1);else showPage(current+1);}
    }else v.autoElapsed=0;
   }
  }
  requestAnimationFrame(loop);
 }
 makeDeck();
 (document.fonts?.ready||Promise.resolve()).then(()=>{fontReady=true;layoutView(cache.get(current));});requestAnimationFrame(loop);

 /* Public developer hooks used by the included regression tests and by integration.
    They are not shown as extra controls in the learner interface. */
 window.TemplatePreview={
  version:'4.1.3-compact-dock',timing:TEMPLATE_TIMING,get prefs(){return {...prefs};},
  configure(next){Object.assign(prefs,next);document.documentElement.style.fontSize=`${16*prefs.scale}px`;manualPaused=false;makeDeck({persist:false});return this.state();},
  show(i){showPage(i);},finish(){finishView(cache.get(current));},replay,pause(){manualPaused=true;updateControls();},resume(){manualPaused=false;updateControls();},
  setFrame(n){selectFrame(cache.get(current),n);},
  simulateVisibility(hidden){docHidden=Boolean(hidden);lastTick=performance.now();},
  breakImage(){const v=cache.get(current);if(v?.img)v.img.src='data:image/png;base64,invalid';},
  state(){const v=cache.get(current);return {index:current,total:deck.length,id:v?.data.id,kind:v?.data.kind,phase:v?.phase,frame:v?.frame,done:v?.done,answer:v?.answer,answerElapsed:v?.answerElapsed,
   fx:v?.fx.id,paused:paused(),scrollTop:course.scrollTop,scrollHeight:course.scrollHeight,clientHeight:course.clientHeight,layout:v?.layout,runner:v?.runner?{index:v.runner.index,elapsed:v.runner.elapsed,done:v.runner.done}:null,reduced:isReduced()};},
  traces(){return traces.slice();}
 };
})();
</script>
